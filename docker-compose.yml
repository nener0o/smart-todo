services:
  backend:
    build: ./backend
    environment:
      SMART_TODO_SECRET_KEY: ${SMART_TODO_SECRET_KEY:-change-me-in-production-please-0123456789abcdef}
      SMART_TODO_CORS_ORIGINS: '["http://localhost:4317"]'
    volumes:
      - todo-data:/data
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "4317:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  todo-data:
